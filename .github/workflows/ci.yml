name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install
        env:
          DOTFILES_DIR: ${{ runner.temp }}/dotfiles
          DOTFILES_REPOSITORY: file://${{ github.workspace }}
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          printf 'existing\n' > "$HOME/.zshrc"
          bash ./install.sh
      - name: Verify
        env:
          DOTFILES_DIR: ${{ runner.temp }}/dotfiles
          HOME: ${{ runner.temp }}/home
        run: |
          zsh -n "$DOTFILES_DIR"/install.zsh "$DOTFILES_DIR"/shell/*.zsh "$DOTFILES_DIR"/shell/themes/*.zsh-theme
          zsh "$DOTFILES_DIR/install.zsh"
          test "$(readlink "$HOME/.zshrc")" = "$DOTFILES_DIR/shell/zshrc"
          grep -q existing "$HOME"/.dotfiles-backup/*/.zshrc
          TERM=xterm-256color zsh -lic 'command -v fzf; command -v zoxide'
          case "$(uname -s)" in
            Darwin) login_shell=$(dscl . -read "/Users/$(id -un)" UserShell | awk '{print $2}') ;;
            Linux) login_shell=$(getent passwd "$(id -un)" | cut -d: -f7) ;;
          esac
          test "${login_shell##*/}" = zsh
